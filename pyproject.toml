[project]
name = "mtcomm"
version = "0.0.1"
description = "MT-mediated communication benchmark: two players in different languages complete grounded tasks through a translation channel"
requires-python = ">=3.11,<3.13"
dependencies = [
    "interpreter-agent-eval",
    "torch>=2.4",
    "transformers>=5.1.0",
    "sentencepiece>=0.2.1",
    "pillow>=10.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1.5",
    "huggingface-hub>=1.4.1",
    "python-dotenv>=1.2.1",
    "boto3>=1.35",
]

[tool.uv.sources]
interpreter-agent-eval = { path = "../../mt-eval/interpreter-agent-eval", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtcomm"]
